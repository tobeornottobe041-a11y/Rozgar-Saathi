<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rozgar Saathi – Maharashtra</title>
<style>
  :root {
    --bg: #ffffff; --text: #000000; --muted: #222222;
    --primary: #0a3a8c; --on-primary: #ffffff;
    --accent: #ffd400; --card: #f2f5fa; --border: #000000;
    --ok: #0b5d1e; --bad: #8a0000;
    --fs: 20px;
  }
  :root[data-theme="dark"] {
    --bg: #000000; --text: #ffffff; --muted: #f0f0f0;
    --primary: #ffd400; --on-primary: #000000;
    --accent: #ffd400; --card: #101010; --border: #ffffff;
    --ok: #7dff9a; --bad: #ff9a9a;
  }
  * { box-sizing: border-box; }
  html { font-size: var(--fs); }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Noto Sans Devanagari", "Segoe UI", Roboto, Arial, sans-serif;
    line-height: 1.55;
  }
  :focus-visible { outline: 5px solid var(--accent); outline-offset: 3px; box-shadow: 0 0 0 3px var(--text); }
  header { background: var(--primary); color: var(--on-primary); padding: 1rem; }
  header h1 { margin: 0 0 .25rem; font-size: 1.6rem; }
  header p { margin: 0; font-size: 1rem; }
  .toolbar { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .9rem; }
  main { max-width: 860px; margin: 0 auto; padding: 1rem; }
  section { background: var(--card); border: 3px solid var(--border); border-radius: 14px; padding: 1rem; margin-bottom: 1.2rem; }
  h2 { margin: 0 0 .6rem; font-size: 1.35rem; }
  label { display: block; font-weight: 700; margin-bottom: .4rem; }
  button, input, select {
    font: inherit; min-height: 52px; border-radius: 10px; border: 3px solid var(--border);
    padding: .5rem .9rem; color: var(--text); background: var(--bg);
  }
  button { cursor: pointer; font-weight: 700; }
  button.primary { background: var(--primary); color: var(--on-primary); }
  button.chip[aria-pressed="true"] { background: var(--accent); color: #000; }
  .row { display: flex; flex-wrap: wrap; gap: .6rem; align-items: stretch; }
  .row input, .row select { flex: 1 1 220px; }
  .row button { flex: 1 1 130px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: .7rem; margin-top: .8rem; }
  .tile { background: var(--bg); border: 3px solid var(--border); border-radius: 12px; padding: .7rem; }
  .tile .num { font-size: 1.7rem; font-weight: 800; word-break: break-word; }
  .tile .lbl { font-weight: 700; }
  .tile .raw { font-size: .75rem; color: var(--muted); word-break: break-word; }
  .msg { margin-top: .8rem; padding: .7rem; border: 3px solid var(--border); border-radius: 10px; background: var(--bg); }
  .msg.err { border-color: var(--bad); color: var(--bad); font-weight: 700; }
  .msg.ok { border-color: var(--ok); }
  .q { background: var(--bg); border: 3px solid var(--border); border-radius: 12px; padding: .8rem; margin-bottom: .7rem; }
  .q p { margin: 0 0 .5rem; font-weight: 700; }
  .yn { display: flex; gap: .6rem; }
  .yn button { flex: 1; }
  .yn button[aria-pressed="true"] { background: var(--accent); color: #000; }
  .scheme { background: var(--bg); border: 3px solid var(--ok); border-radius: 12px; padding: .8rem; margin-top: .7rem; }
  .scheme h3 { margin: 0 0 .3rem; font-size: 1.15rem; }
  .scheme p { margin: .2rem 0; }
  #voice-note { background: #fff; color: #000; border: 3px solid var(--accent); border-radius: 10px; padding: .6rem .8rem; margin: .8rem 0 0; font-size: .9rem; font-weight: 700; }
  .sr-only { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  footer { max-width: 860px; margin: 0 auto; padding: 0 1rem 2rem; font-size: .85rem; }
  a { color: inherit; font-weight: 700; }
</style>
</head>
<body>

<a class="sr-only" href="#search-section" id="skip">Skip to content</a>

<header>
  <h1 id="t-title"></h1>
  <p id="t-sub"></p>
  <div class="toolbar" role="group" aria-label="Settings">
    <button class="chip" data-lang="en" aria-pressed="true" lang="en">English</button>
    <button class="chip" data-lang="hi" aria-pressed="false" lang="hi">हिन्दी</button>
    <button class="chip" data-lang="mr" aria-pressed="false" lang="mr">मराठी</button>
    <button class="chip" id="btn-voice" aria-pressed="false"></button>
    <button class="chip" id="btn-bigger"></button>
    <button class="chip" id="btn-smaller"></button>
    <button class="chip" id="btn-contrast" aria-pressed="false"></button>
    <button class="chip" id="btn-readpage"></button>
  </div>
  <p id="voice-note" role="status" hidden></p>
</header>

<main>
  <div id="live" class="sr-only" aria-live="polite" role="status"></div>

  <section id="search-section" aria-labelledby="t-step1">
    <h2 id="t-step1"></h2>
    <label for="district" id="t-label"></label>
    <div class="row">
      <select id="district"></select>
      <button class="primary" id="btn-search"></button>
      <button id="btn-mic"></button>
    </div>
    <div id="result" tabindex="-1"></div>
  </section>

  <section id="elig-section" aria-labelledby="t-step2">
    <h2 id="t-step2"></h2>
    <p id="t-elig-intro"></p>
    <div id="questions"></div>
    <div class="row">
      <button class="primary" id="btn-check"></button>
      <button id="btn-guide"></button>
      <button id="btn-reset"></button>
    </div>
    <div id="elig-result" tabindex="-1"></div>
  </section>
</main>

<footer>
  <p id="t-foot"></p>
</footer>

const normText = (s) => String(s).toLowerCase().replace(/[\s\-_.,()\/]/g, "");
function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function announce(text) { $("live").textContent = ""; setTimeout(() => { $("live").textContent = text; }, 50); }

/* ---------------- Speech output (text-to-speech) ------------------ */
let VOICES = [];
function loadVoices() {
  if (!("speechSynthesis" in window)) return;
  VOICES = window.speechSynthesis.getVoices();
  updateVoiceNote();
}
if ("speechSynthesis" in window) window.speechSynthesis.onvoiceschanged = loadVoices;

function voiceLang(v) { return v.lang.replace("_", "-").toLowerCase(); }
function findVoice(code) {
  const want = code.toLowerCase(), prefix = want.split("-")[0];
  return VOICES.find((v) => voiceLang(v) === want)
      || VOICES.find((v) => voiceLang(v) === prefix || voiceLang(v).startsWith(prefix + "-"))
      || null;
}
/* Best voice for the chosen language; Marathi falls back to a Hindi voice (same script) */
function pickVoice() {
  if ("speechSynthesis" in window && !VOICES.length) VOICES = window.speechSynthesis.getVoices();
  let v = findVoice(SPEECH_LANG[lang]);
  if (v) return { voice: v, code: SPEECH_LANG[lang], fallback: false };
  if (lang === "mr") {
    v = findVoice("hi-IN");
    if (v) return { voice: v, code: "hi-IN", fallback: true };
  }
  return { voice: null, code: SPEECH_LANG[lang], fallback: lang !== "en" };
}
function updateVoiceNote() {
  const el = $("voice-note");
  if (!el) return;
  const p = pickVoice();
  if (lang === "en" || !VOICES.length || !p.fallback) { el.hidden = true; return; }
  el.textContent = p.voice ? tr().voiceFallback : tr().voiceMissing;
  el.hidden = false;
}
/* Long text is split into sentences: Chrome stops reading long passages */
function utterances(text) {
  const parts = String(text).match(/[^.।?!]+[.।?!]*/g) || [String(text)];
  const p = pickVoice();
  return parts.map((x) => x.trim()).filter(Boolean).map((x) => {
    const u = new SpeechSynthesisUtterance(x);
    u.lang = p.code;
    u.rate = 0.9;
    if (p.voice) u.voice = p.voice;
    return u;
  });
}
function speak(text, force) {
  if (!force && !voiceHelp) return;
  if (!("speechSynthesis" in window) || !text) return;
  const synth = window.speechSynthesis;
  synth.cancel();
  if (synth.paused) synth.resume();
  utterances(text).forEach((u) => synth.speak(u));
}
function speakAsync(text) {
  return new Promise((resolve) => {
    if (!("speechSynthesis" in window) || !text) return resolve();
    const synth = window.speechSynthesis;
    synth.cancel();
    const list = utterances(text);
    if (!list.length) return resolve();
    list.forEach((u, i) => {
      if (i === list.length - 1) { u.onend = resolve; u.onerror = resolve; }
      synth.speak(u);
    });
  });
}

/* ---------------- Speech input (voice recognition) ---------------- */
function listenOnce() {
  return new Promise((resolve, reject) => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return reject(new Error("unsupported"));
    const rec = new SR();
    rec.lang = SPEECH_LANG[lang];
    rec.interimResults = false;
    rec.maxAlternatives = 3;
    rec.onresult = (e) => resolve(Array.from(e.results[0]).map((a) => a.transcript));
    rec.onerror = (e) => reject(new Error(e.error || "error"));
    rec.onnomatch = () => reject(new Error("nomatch"));
    rec.start();
  });
}

function entryFor(apiName) {
  const n = normText(apiName);
  return DISTRICT_NAMES.find((d) => d[0] === n || (d[2] || []).includes(n));
}
function displayName(apiName) {
  const pretty = apiName.charAt(0).toUpperCase() + apiName.slice(1).toLowerCase();
  if (lang === "en") return pretty;
  const e = entryFor(apiName);
  return e ? e[1] : pretty;
}
function renderDistrictList() {
  const sel = $("district");
  const keep = sel.value;                       // keep the chosen district when language changes
  const sorted = apiDistricts.slice().sort((a, b) => displayName(a).localeCompare(displayName(b), lang));
  sel.innerHTML = `<option value="">${esc(tr().choose)}</option>` +
    sorted.map((d) => `<option value="${esc(d)}">${esc(displayName(d))}</option>`).join("");
  if (keep && apiDistricts.includes(keep)) sel.value = keep;
}

/* ---------------- District lookup --------------------------------- */
function resolveDistrict(text) {
  const q = normText(text);
  if (!q) return null;
  for (const name of apiDistricts) {
    const e = entryFor(name);
    const keys = [normText(name)];
    if (e) keys.push(e[0], normText(e[1]), ...(e[2] || []).map(normText));
    if (keys.includes(q)) return name;
  }
  for (const name of apiDistricts) {           // partial match as a fallback
    const e = entryFor(name);
    const keys = [normText(name)];
    if (e) keys.push(normText(e[1]));
    if (keys.some((k) => k.includes(q) || (q.length > 3 && q.includes(k)))) return name;
  }
  return null;
}

  ["Women_Persondays", "Women's person-days", "महिलाओं के व्यक्ति-दिवस", "महिलांचे व्यक्ती-दिवस"],
  ["percentage_payments_gererated_within_15_days", "Payments made within 15 days (%)", "15 दिन में हुए भुगतान (%)", "15 दिवसांत झालेली देयके (%)"]
];
const LANG_INDEX = { en: 1, hi: 2, mr: 3 };

function pickLabel(key) {
  const k = key.toLowerCase();
  if (/job.?card/.test(k)) return "jobcard";
  if (/person.?day/.test(k)) return "personday";
  if (/house.?hold/.test(k)) return "household";
  if (/worker/.test(k)) return "worker";
  return "other";
}
function prettyKey(key) { return key.replace(/_/g, " ").replace(/\s+/g, " ").trim(); }
function fmtNum(v) {
  const n = Number(String(v).replace(/,/g, ""));
  return isFinite(n) && String(v).trim() !== "" ? n.toLocaleString("en-IN", { maximumFractionDigits: 1 }) : String(v);
}

async function searchDistrict(text) {
  const t = tr();
  const box = $("result");
  const name = resolveDistrict(text);
  if (!text.trim()) { box.innerHTML = `<div class="msg err">${esc(t.emptyInput)}</div>`; speak(t.emptyInput); return; }
  if (!name) { box.innerHTML = `<div class="msg err">${esc(t.notFound)}</div>`; speak(t.notFound); return; }

  box.innerHTML = `<div class="msg">${esc(t.loading)}</div>`;
  try {
    const res = await fetch("/api/employment?district=" + encodeURIComponent(name));
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || t.apiDown);
    const rec = data.records[0];
    const skip = /^(s\.?no|sno|sr|id|state|district|fin|year|month|remarks)/i;
    let entries = KEY_FIELDS
      .filter(([k]) => rec[k] !== undefined && rec[k] !== "" && rec[k] !== null)
      .map(([k, ...labels]) => [k, rec[k], labels[LANG_INDEX[lang] - 1]]);
    if (!entries.length) {            // other dataset: show whatever columns exist
      entries = Object.entries(rec)
        .filter(([k, v]) => v !== "" && v !== null && !skip.test(k))
        .slice(0, 12)
        .map(([k, v]) => { const c = pickLabel(k); return [k, v, c !== "other" ? t.fields[c] : prettyKey(k)]; });
    }
    const tiles = entries.map(([k, v, label]) =>
      `<div class="tile"><div class="lbl">${esc(label)}</div><div class="num">${esc(fmtNum(v))}</div></div>`).join("");
    const spoken = t.summaryStart.replace("{d}", displayName(name)) + " " +
      entries.slice(0, 5).map(([k, v, label]) => label + " " + fmtNum(v)).join(", ") + ".";
    lastSummary = spoken;
    box.innerHTML = `
      <div class="msg ok">
        <strong>${esc(t.employmentIn)} ${esc(displayName(name))}</strong><br>
        <small>${esc(t.liveData)}${data.period ? " · " + esc(data.period) : ""}</small>
        <div class="grid">${tiles}</div>
        <p><button id="btn-listen-result">${esc(t.listen)}</button></p>
      </div>`;
    $("btn-listen-result").onclick = () => speak(lastSummary, true);
    announce(spoken);
    speak(spoken);
  } catch (err) {
    box.innerHTML = `<div class="msg err">${esc(err.message)}<br>${esc(t.apiDown)}</div>`;
    speak(t.apiDown);
  }
}

/* ---------------- Eligibility ------------------------------------- */
function eligibleSchemes(a) {
  const out = [];
  if (a.rural === "yes" && a.adult === "yes") out.push("mgnrega");
  if (a.land === "yes") out.push("pmkisan", "pmfby", "kcc");
  if (a.worker === "yes") out.push("eshram");
  return out;
}
function showEligibility() {
  const t = tr();
  const box = $("elig-result");
  if (QUESTION_KEYS.some((k) => !answers[k])) {
    box.innerHTML = `<div class="msg err">${esc(t.answerAll)}</div>`;
    speak(t.answerAll);
    return;
  }
  const list = eligibleSchemes(answers);
  if (!list.length) {
    box.innerHTML = `<div class="msg">${esc(t.none)}</div>`;
    announce(t.none); speak(t.none);
    return;
  }
  const cards = list.map((id) => {
    const s = t.schemes[id];
    return `<div class="scheme"><h3>${esc(s.n)}</h3>
      <p><strong>${esc(t.who)}</strong> ${esc(s.w)}</p>
      <p><strong>${esc(t.how)}</strong> ${esc(s.h)}</p>
      <button data-say="${id}">${esc(t.listen)}</button></div>`;
  }).join("");
  box.innerHTML = `<div class="msg ok"><strong>${esc(t.youMayGet)}</strong></div>${cards}<div class="msg">${esc(t.note)}</div>`;
  box.querySelectorAll("[data-say]").forEach((b) => {
    b.onclick = () => { const s = t.schemes[b.dataset.say]; speak(`${s.n}. ${s.w} ${s.h}`, true); };
  });
  const spoken = t.youMayGet + " " + list.map((id) => t.schemes[id].n).join(". ") + ". " + t.note;
  announce(t.youMayGet + " " + list.map((id) => t.schemes[id].n).join(", "));
  speak(spoken);
  box.focus();
}

function parseYesNo(candidates) {
  const yes = ["yes", "yeah", "yep", "ha", "haan", "han", "हाँ", "हां", "हा", "हो", "होय", "जी", "जी हाँ", "बरोबर"];
  const no = ["no", "nope", "nahi", "nahin", "नहीं", "नही", "नाही", "नको", "ना"];
  for (const c of candidates) {
    const words = c.toLowerCase().trim().split(/\s+/);
    if (words.some((w) => no.includes(w))) return "no";
    if (words.some((w) => yes.includes(w))) return "yes";
  }
  return null;
}

async function runVoiceGuide() {
  const t = tr();
  if (!(window.SpeechRecognition || window.webkitSpeechRecognition)) {
    $("elig-result").innerHTML = `<div class="msg err">${esc(t.noSpeech)}</div>`;
    speak(t.noSpeech, true);
    return;
  }
  answers = {};
  renderQuestions();
  await speakAsync(t.guideStart);
  for (const k of QUESTION_KEYS) {
    let got = null, tries = 0;
    while (!got && tries < 3) {
      await speakAsync(t.q[k]);
      try { got = parseYesNo(await listenOnce()); } catch (e) { /* retry */ }
      if (!got) await speakAsync(t.didntCatch);
      tries++;
    }
    if (!got) return;                      // give up quietly after 3 tries
    answers[k] = got;
    renderQuestions();
  }
  await speakAsync(t.guideDone);
  showEligibility();
}

/* ------------------------------------------------------------------ */
/* Wire up buttons                                                    */
/* ------------------------------------------------------------------ */
document.querySelectorAll("[data-lang]").forEach((b) => {
  b.onclick = () => { lang = b.dataset.lang; applyLanguage(); speak(tr().sub); };
});
$("btn-voice").onclick = () => {
  voiceHelp = !voiceHelp;
  $("btn-voice").setAttribute("aria-pressed", voiceHelp);
  $("btn-voice").textContent = voiceHelp ? tr().voiceOn : tr().voiceOff;
  if (voiceHelp) speak(tr().voiceOn); else window.speechSynthesis && window.speechSynthesis.cancel();
};
$("btn-bigger").onclick = () => { fontSize = Math.min(32, fontSize + 3); document.documentElement.style.setProperty("--fs", fontSize + "px"); };
$("btn-smaller").onclick = () => { fontSize = Math.max(16, fontSize - 3); document.documentElement.style.setProperty("--fs", fontSize + "px"); };
$("btn-contrast").onclick = () => {
  const root = document.documentElement;
  root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
  $("btn-contrast").setAttribute("aria-pressed", root.dataset.theme === "dark");
  $("btn-contrast").textContent = root.dataset.theme === "dark" ? tr().contrastOn : tr().contrastOff;
};
$("btn-readpage").onclick = () => {
  const t = tr();
  speak([t.title, t.sub, t.step1, t.label, t.step2, t.eligIntro].join(". "), true);
};
$("btn-search").onclick = () => searchDistrict($("district").value);
$("district").addEventListener("change", () => { if ($("district").value) searchDistrict($("district").value); });
$("btn-mic").onclick = async () => {
  const t = tr();
  if (!(window.SpeechRecognition || window.webkitSpeechRecognition)) {
    $("result").innerHTML = `<div class="msg err">${esc(t.noSpeech)}</div>`;
    speak(t.noSpeech, true);
    return;
  }
  $("result").innerHTML = `<div class="msg">${esc(t.listening)}</div>`;
  await speakAsync(voiceHelp ? t.listening : "");
  try {
    const alts = await listenOnce();
    let found = null, heard = alts[0];
    for (const a of alts) { if (resolveDistrict(a)) { found = a; break; } }
    const resolved = resolveDistrict(found || heard);
    if (resolved) $("district").value = resolved;
    $("result").innerHTML = `<div class="msg">${esc(t.heard)} ${esc(heard)}</div>`;
    await searchDistrict(found || heard);
  } catch (e) {
    $("result").innerHTML = `<div class="msg err">${esc(t.didntCatch)}</div>`;
    speak(t.didntCatch, true);
  }
};
$("questions").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-q]");
  if (!b) return;
  answers[b.dataset.q] = b.dataset.a;
  renderQuestions();
  const again = document.querySelector(`button[data-q="${b.dataset.q}"][data-a="${b.dataset.a}"]`);
  if (again) again.focus();
  speak(b.dataset.a === "yes" ? tr().yes : tr().no);
});
$("btn-check").onclick = showEligibility;
$("btn-guide").onclick = runVoiceGuide;
$("btn-reset").onclick = () => { answers = {}; renderQuestions(); $("elig-result").innerHTML = ""; };

/* Speak the label of whatever button/input gets focus when Voice help is ON */
document.addEventListener("focusin", (e) => {
  if (!voiceHelp) return;
  const el = e.target;
  if (!(el instanceof HTMLElement)) return;
  if (el.id === "district") { speak(tr().label); return; }
  if (el.tagName === "BUTTON") {
    const q = el.dataset.q ? tr().q[el.dataset.q] + " " : "";
    speak(q + el.textContent.replace(/[^\p{L}\p{N}\s+−-]/gu, ""));
  }
});

/* ---------------- Start ------------------------------------------- */
async function init() {
  loadVoices();
  applyLanguage();
  try {
    const res = await fetch("/api/districts");
    const data = await res.json();
    apiDistricts = data.districts || [];
    renderDistrictList();
    if (!data.ok) {
      $("result").innerHTML = `<div class="msg err">${esc(tr().apiDown)}<br><small>${esc(data.error || "")}</small></div>`;
    }
  } catch (e) {
    $("result").innerHTML = `<div class="msg err">${esc(tr().apiDown)}</div>`;
  }
}
init();
</script>
